name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run (06:00 UTC) to catch changes in the application under test.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  test:
    name: ${{ matrix.project }} (shard ${{ matrix.shard }}/2)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
        shard: [1, 2]
        include:
          - project: mobile-chrome
            shard: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The `setup` project (login + storageState) always runs on Chromium,
      # so every job needs Chromium in addition to the browser under test.
      - name: Install browsers
        run: |
          BROWSER=${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}
          npx playwright install --with-deps chromium "$BROWSER"

      - name: Run tests
        run: >
          npx playwright test
          --project=${{ matrix.project }}
          --shard=${{ matrix.shard }}/${{ matrix.project == 'mobile-chrome' && 1 || 2 }}
        env:
          SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD || 'secret_sauce' }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.project }}-${{ matrix.shard }}
          path: blob-report
          retention-days: 7

  report:
    name: Merge & publish report
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v5
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # Publishes the latest report of `main` to GitHub Pages.
  # Kept in its own job: the `github-pages` environment only accepts deployments
  # from `main`, so pull requests (e.g. from Dependabot) must never reach it.
  deploy:
    name: Deploy report to GitHub Pages
    needs: report
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download HTML report
        uses: actions/download-artifact@v5
        with:
          name: playwright-report
          path: playwright-report
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
